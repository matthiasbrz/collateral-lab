version: 2

models:
  - name: stg_mutations
    description: >
      Une ligne par mutation DVF.

      Le grain source est le croisement (local x subdivision fiscale) : une ligne
      brute n'est pas une vente. Aucun filtre metier n'est applique ici.
      Verifie le 16/08/2026 : aucune mutation ne porte deux valeurs foncieres.
    columns:
      - name: id_mutation
        description: Identifiant Etalab de la mutation. Cle du modele.
        data_tests:
          - unique
          - not_null
      - name: date_mutation
        data_tests: [not_null]
      - name: code_commune
        data_tests: [not_null]
      - name: nb_communes
        data_tests: [not_null]
      - name: nb_natures
        data_tests: [not_null]
      - name: valeur_fonciere
        description: >
          Prix total de la mutation, repete a l'identique sur chaque ligne source.
          Nullable : 320 mutations sans valeur exploitable, ecartees en aval.
      - name: nb_lignes_source
        description: >
          Nombre de lignes brutes agregees. Moyenne 2,5. Sert a expliquer
          l'ecart entre volumetrie brute et volumetrie metier.
      - name: surface_bati
        description: >
          Surface batie des locaux principaux, dependances exclues.
          Convention : la dependance entre au numerateur du prix du m2,
          pas au denominateur.
version: 2

models:
  - name: stg_mutations
    description: >
      Une ligne par mutation DVF.

      Le grain source est le croisement (local x subdivision fiscale) : une ligne
      brute n'est pas une vente. Aucun filtre metier n'est applique ici.
      Verifie le 16/08/2026 : aucune mutation ne porte deux valeurs foncieres.
    columns:
      - name: id_mutation
        description: Identifiant Etalab de la mutation. Cle du modele.
        data_tests:
          - unique
          - not_null
      - name: date_mutation
        data_tests: [not_null]
      - name: code_commune
        data_tests: [not_null]
      - name: nb_communes
        data_tests: [not_null]
      - name: nb_natures
        data_tests: [not_null]
      - name: valeur_fonciere
        description: >
          Prix total de la mutation, repete a l'identique sur chaque ligne source.
          Nullable : 320 mutations sans valeur exploitable, ecartees en aval.
      - name: nb_lignes_source
        description: >
          Nombre de lignes brutes agregees. Moyenne 2,5. Sert a expliquer
          l'ecart entre volumetrie brute et volumetrie metier.
      - name: surface_bati
        description: >
          Surface batie des locaux principaux, dependances exclues.
          Convention : la dependance entre au numerateur du prix du m2,
          pas au denominateur.

  - name: dim_commune
    description: >
      Une commune de plein exercice au millesime 2026.

      Source : Code officiel geographique de l'Insee. Le filtre TYPECOM = 'COM'
      exclut communes deleguees, associees et arrondissements municipaux.
      34 875 communes, conforme au decompte officiel au 01/01/2026.
    columns:
      - name: code_commune
        description: Code INSEE. Cle de la dimension.
        data_tests:
          - unique
          - not_null
      - name: nom_commune
        description: >
          Libelle au millesime 2026. Diverge du libelle porte par DVF pour les
          communes renommes : 19 changements de nom sur le millesime.
        data_tests: [not_null]
      - name: millesime_cog
        description: Millesime du referentiel, declare en variable dbt.
        data_tests: [not_null]
version: 2

models:
  - name: agg_prix_m2_mensuel
    description: >
      Prix median au m2 par commune, type de bien et mois.

      Agregat d'observation : aucun modele ne le consomme. Il mesure la
      dispersion du volume mensuel, qui justifie le passage a une fenetre
      glissante - 12 669 cellules, dont 52 % ne contiennent qu'une seule
      vente et 15,1 % atteignent cinq transactions.
    columns:
      - name: code_commune
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_commune')
                field: code_commune
              config:
                severity: warn
                error_if: ">5"
                warn_if: ">0"
      - name: type_local
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('dim_type_bien'), field: type_local }
      - name: mois
        data_tests: [not_null]
      - name: nb_mutations
        description: >
          Volume de la cellule. Indicateur de fiabilite : une mediane sur une
          transaction est cette transaction.
        data_tests: [not_null]
      - name: prix_m2_median
        data_tests: [not_null]

  - name: agg_prix_m2_glissant
    description: >
      Grain : une ligne = commune x type de bien x mois de reference.
      Fenetre : 12 mois glissants, mois courant inclus.

      La mediane est calculee au grain transaction, jamais a partir de medianes mensuelles : quantil_cont n'est pas decomposable. Verifie le 19/08.
      Intermediaire assume : 468 775 lignes, soit 10,05 mois de reference par transaction en moyenne.
    columns:
      - name: mois
        description: >
          mois de reference : dernier mois de la fenetre de douze
      - name: nb_mutations_12m
        description: >
          volume de la fenetre, zero possible : le squelette garde les mois sans vente
      - name: prix_m2_median_12m
        description: >
          comment la mediane est calculee, et pourquoi jamais a partir des medianes mensuelles
      - name: fenetre_complete
        description: >
          quand elle est vraie, et quel modele la filtre

  - name: agg_prix_m2_evolution
    description: >
      Grain : commune x type de bien x mois de reference.
      Ajoute les indicateurs derives : dispersion et evolution sur douze mois.
    columns:
      - name: prix_m2_median_12m_n1
        description: >
          a quoi la mediane est comparee : la meme cellule douze mois plus tot
      - name: evolution_pct
        description: >
          le calcul, et les deux cas ou elle est nulle
      - name: ecart_interquartile
        description: >
          q3 moins q1, en euros par m2
      - name: dispersion_relative
        description: >
          ecart interquartile rapporte a la mediane : ce qu'il dit de la cellule

  - name: mart_prix_m2_reference
    description: >
      Prix de reference au m2 par commune, type de bien et mois, sur douze
      mois glissants.

      Couche de publication. 11 383, 79 % des communes couvertes.
      Aucune cellule sous cinq transactions : seuil de gouvernance ET de
      fiabilite. 47 % des cellules publiees reposent sur 5 a 9 transactions.
    columns:
      - name: code_commune
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('dim_commune'), field: code_commune }
      - name: nom_commune
        data_tests: [not_null]
      - name: type_local
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('dim_type_bien'), field: type_local }
      - name: mois
        data_tests: [not_null]
      - name: prix_m2_median_12m
        data_tests: [not_null]
      - name: nb_mutations_12m
        data_tests: [not_null]
      # evolution_pct volontairement absente : nullable par construction.
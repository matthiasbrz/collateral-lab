version: 2

models:
  - name: agg_prix_m2_mensuel
    description: >
      Prix median au m2 par commune, type de bien et mois.

      Agregat d'observation : aucun modele ne le consomme. Il mesure la
      dispersion du volume mensuel, qui justifie le passage a une fenetre
      glissante - 12 669 cellules, dont 52 % ne contiennent qu'une seule
      vente et 15,1 % atteignent cinq transactions.
    columns:
      - name: code_commune
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_commune')
                field: code_commune
              config:
                severity: warn
                error_if: ">5"
                warn_if: ">0"
      - name: type_local
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('dim_type_bien'), field: type_local }
      - name: mois
        data_tests: [not_null]
      - name: nb_mutations
        description: >
          Volume de la cellule. Indicateur de fiabilite : une mediane sur une
          transaction est cette transaction.
        data_tests: [not_null]
      - name: prix_m2_median
        data_tests: [not_null]

  - name: agg_prix_m2_glissant
    description: >
      Grain : une ligne = commune x type de bien x mois de reference.
      Fenetre : 12 mois glissants, mois courant inclus.

      La mediane est calculee au grain transaction, jamais a partir de medianes mensuelles : quantile_cont n'est pas decomposable. Verifie le 19/08.
      Intermediaire assume : 468 775 lignes, soit 10,05 mois de reference par transaction en moyenne.
    columns:
      - name: mois
        description: >
          Mois de reference : dernier mois de la fenetre de douze.
      - name: nb_mutations_12m
        description: >
          Nombre de ventes de la fenetre. Zero possible : le squelette garde les mois sans vente, et les quantiles y sont NULL.
      - name: prix_m2_median_12m
        description: >
          Mediane du prix au m2 des ventes de la fenetre, arrondie a l'euro, calculee au grain transaction : jamais a partir des medianes mensuelles.
      - name: fenetre_complete
        description: >
          Vraie a partir du douzieme mois du calendrier, quand les douze mois de la fenetre existent. mart_prix_m2_reference ne publie que ces lignes.

  - name: agg_prix_m2_evolution
    description: >
      Grain : commune x type de bien x mois de reference.
      Ajoute les indicateurs derives : dispersion et evolution sur douze mois.
    columns:
      - name: prix_m2_median_12m_n1
        description: >
          Mediane glissante de la meme cellule douze mois plus tot, sans condition sur sa fenetre : complete ou non, au-dessus du seuil ou non (constat du 28/10).
      - name: evolution_pct
        description: >
          Evolution de la mediane glissante sur un an, en pourcentage arrondi au dixieme. NULL quand une des deux medianes manque. Calculee aujourd'hui meme sur une fenetre N-1 incomplete ou sous le seuil (constat du 28/10).
      - name: ecart_interquartile
        description: >
          Q3 moins Q1 de la fenetre, en euros par m2.
      - name: dispersion_relative
        description: >
          Ecart interquartile rapporte a la mediane, arrondi au millieme : plus il est haut, moins la mediane resume la cellule.

  - name: mart_prix_m2_reference
    description: >
      Prix de reference au m2 par commune, type de bien et mois, sur douze
      mois glissants.

      Couche de publication. 11 383, 79 % des communes couvertes.
      Aucune cellule sous cinq transactions : seuil de gouvernance ET de
      fiabilite. 47 % des cellules publiees reposent sur 5 a 9 transactions.
    columns:
      - name: code_commune
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('dim_commune'), field: code_commune }
      - name: nom_commune
        data_tests: [not_null]
      - name: type_local
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('dim_type_bien'), field: type_local }
      - name: mois
        data_tests: [not_null]
      - name: prix_m2_median_12m
        data_tests: [not_null]
      - name: nb_mutations_12m
        data_tests: [not_null]
      # evolution_pct volontairement absente : nullable par construction.

  - name: ref_seuils_dispersion
    description: >
      Bornes de la dispersion relative par type de bien, aux terciles des cellules publiees.

      Feuille assumee depuis le 19/09 : aucun modele ne la lit. Ses deux bornes
      decoupent la dispersion en trois classes de meme effectif ; aucun modele
      ne les applique.
    columns:
      - name: type_local
        description: >
          Maison ou Appartement : une ligne par type de bien.
      - name: borne_basse
        description: >
          Premier tercile de la dispersion relative des cellules publiees, arrondi au millieme.
      - name: borne_haute
        description: >
          Deuxieme tercile de la dispersion relative, arrondi au millieme.
      - name: mediane
        description: >
          Mediane de la dispersion relative, arrondie au millieme.

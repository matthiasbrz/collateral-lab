[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "collateral-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["duckdb==1.5.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]

[project.optional-dependencies]
# dbt-duckdb reste en dev tant que build.py ne l'appelle pas.
# Passera en dependencies a la bascule (semaine 5), quand les neufs modeles
# seront portes. Voir docs/architecture.md.
dev = ["pytest", "ruff", "dbt-duckdb"]

[tool.pytest.ini_options]
testpaths = ["tests/unitaires"]
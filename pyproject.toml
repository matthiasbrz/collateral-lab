[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "collateral-lab"
version = "0.1.0"
requires-python = "==3.12.10"
dependencies = [
    "duckdb==1.5.5",
    "dbt-core==1.12.4",
    "dbt-duckdb==1.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]

[project.optional-dependencies]
# dbt-duckdb reste en dev tant que build.py ne l'appelle pas.
# Passera en dependencies a la bascule (semaine 5), quand les neufs modeles
# seront portes. Voir docs/architecture.md.
dev = [
    "pytest==9.1.1", 
    "ruff==0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests/unitaires"]